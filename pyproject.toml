[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numpy-dl-framework"
version = "1.0.0"
description = "Educational NumPy neural network layers with explicit backward passes"
requires-python = ">=3.9"
readme = "README.md"
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
numpy-dl = "numpy_dl.cli:main"

[tool.setuptools.packages.find]
include = ["numpy_dl*"]
